name: Tests Symfony

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: vite_gourmand_test
                    MYSQL_USER: symfony
                    MYSQL_PASSWORD: symfony
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Récupérer le code
              uses: actions/checkout@v4

            - name: Installer PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, intl, pdo, pdo_mysql, xml
                  coverage: none
                  tools: composer:v2

            - name: Vérifier Composer
              run: composer validate --strict

            - name: Installer les dépendances
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Préparer la base de test
              env:
                  APP_ENV: test
                  DATABASE_URL: mysql://symfony:symfony@127.0.0.1:3306/vite_gourmand_test
              run: |
                  php bin/console doctrine:database:create --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction
                  php bin/console doctrine:fixtures:load --no-interaction --group=test

            - name: Exécuter les tests PHPUnit
              env:
                  APP_ENV: test
                  DATABASE_URL: mysql://symfony:symfony@127.0.0.1:3306/vite_gourmand_test
              run: php bin/phpunit