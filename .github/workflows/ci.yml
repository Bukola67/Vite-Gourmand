name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: ci_test_secret
      KERNEL_CLASS: 'App\Kernel'
      DEFAULT_URI: 'http://localhost'
      DATABASE_URL: 'mysql://vite_gourmand_user:vite_gourmand_password@127.0.0.1:3306/vite_gourmand_test?serverVersion=8.0&charset=utf8mb4'
      MAILER_DSN: 'null://null'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: vite_gourmand_test
          MYSQL_USER: vite_gourmand_user
          MYSQL_PASSWORD: vite_gourmand_password
          MYSQL_ROOT_PASSWORD: root_password_change_me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password_change_me --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, mbstring, pdo, pdo_mysql, xml
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Check MySQL connection
        run: |
          mysqladmin ping \
            -h 127.0.0.1 \
            -P 3306 \
            -uroot \
            -proot_password_change_me \
            --silent

      - name: Clear Symfony test cache
        run: php bin/console cache:clear --env=test --no-warmup

      - name: Install importmap assets
        run: php bin/console importmap:install --env=test

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Load test fixtures
        run: php bin/console doctrine:fixtures:load --no-interaction --env=test --group=test

      - name: Run PHPUnit
        run: php bin/phpunit --configuration phpunit.dist.xml